name: Export Help Center

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - incremental
      source:
        description: "Data source"
        required: true
        default: "auto"
        type: choice
        options:
          - api
          - crawler
          - auto
      locale:
        description: "Locale filter (e.g. pt-br)"
        required: false
        default: "pt-br"
      publish_artifacts:
        description: "Upload output artifacts"
        required: true
        default: true
        type: boolean
      updated_since:
        description: "ISO datetime for incremental mode"
        required: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run export pipeline
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
        run: |
          CMD="python -m src.main --mode '${{ github.event.inputs.mode }}' --source '${{ github.event.inputs.source }}' --locale '${{ github.event.inputs.locale }}'"
          if [ "${{ github.event.inputs.mode }}" = "incremental" ] && [ -n "${{ github.event.inputs.updated_since }}" ]; then
            CMD="$CMD --updated-since '${{ github.event.inputs.updated_since }}'"
          fi
          echo "$CMD"
          eval "$CMD"

      - name: Upload artifacts
        if: ${{ github.event.inputs.publish_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: help-center-export
          path: |
            data/raw
            data/normalized
            data/markdown
            data/exports
