name: Export Help Center

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - incremental
      locale:
        description: "Locale filter (e.g. pt-br)"
        required: false
        default: "pt-br"
      publish_artifacts:
        description: "Upload output artifacts"
        required: true
        default: true
        type: boolean

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler pipeline
        run: |
          python -m src.main --mode "${{ github.event.inputs.mode }}" --locale "${{ github.event.inputs.locale }}"

      - name: Upload artifacts
        if: ${{ github.event.inputs.publish_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: help-center-export
          path: |
            data/exports
            data/markdown
            data/exports/chunks.jsonl
            data/exports/manifest.json
